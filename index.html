<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandbox de física</title>
<style>
:root{--bg:#dfe3ea;--ui:rgba(250,251,253,.84);--ink:#1b1e25;--mut:#5b6270;--line:rgba(20,25,40,.16);--on:#1b1e25;--onink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--ui:rgba(28,31,38,.84);--ink:#eceff4;--mut:#9aa3b2;--line:rgba(255,255,255,.16);--on:#eceff4;--onink:#14161a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--ui:rgba(28,31,38,.84);--ink:#eceff4;--mut:#9aa3b2;--line:rgba(255,255,255,.16);--on:#eceff4;--onink:#14161a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 0;text-align:center;font-size:13px;color:var(--mut);pointer-events:none;transition:opacity .8s}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--ui);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:grid;gap:8px;touch-action:manipulation}
.row{display:grid;gap:8px;grid-template-columns:repeat(var(--n),1fr)}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 6px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#gun,#wp{position:fixed;bottom:calc(var(--bh,150px) + 12px);display:grid;gap:8px}
#gun{right:12px}#wp{left:12px}
.gb,.wb{background:var(--ui);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 14px}
.go{background:var(--on);color:var(--onink);border-color:var(--on);font-weight:650}
.dot{width:12px;height:12px;border-radius:50%}
</style>

<body>
<canvas id="c"></canvas>
<div id="hint">Arrastra un objeto para moverlo y suéltalo en movimiento para lanzarlo. Arrastra el vacío para girar la cámara; pellizca para acercar.</div>
<div id="wp"><button class="wb" id="wbtn" aria-pressed="false">Arma: Mano</button><button class="wb" id="addc">+ Personaje</button></div>
<div id="gun">
  <button class="gb" data-p="a" aria-pressed="false"><span class="dot" style="background:#2fa0ff"></span>Portal azul</button>
  <button class="gb" data-p="o" aria-pressed="false"><span class="dot" style="background:#ff8a1f"></span>Portal naranja</button>
</div>
<div id="bar">
  <div class="row" style="--n:3">
    <button class="chip" data-t="b" aria-pressed="true"><span class="dot" style="background:#ff4fa3"></span>Rebota</button>
    <button class="chip" data-t="c" aria-pressed="false"><span class="dot" style="background:#4f8dff"></span>Choca</button>
    <button class="chip" data-t="g" aria-pressed="false"><span class="dot" style="background:#6dff2e"></span>Pegajoso</button>
  </div>
  <div class="row" style="--n:4">
    <button class="go" id="drop">Soltar</button>
    <button class="go" id="shoot">Lanzar</button>
    <button class="act" id="walls">Paredes</button>
    <button id="clear">Limpiar</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(()=>{
if(!window.THREE||!window.CANNON){document.body.insertAdjacentHTML('beforeend','<p style="padding:24px">No se pudieron cargar las librerías 3D.</p>');return}
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const t0=document.documentElement.dataset.theme;
const dark=t0?t0==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const C=dark?{bg:0x14161a,fl:0x22252c,g1:0x3b404c,g2:0x2b2f38,wl:0x3a3f4b}:{bg:0xdfe3ea,fl:0xcdd2dc,g1:0xa5acba,g2:0xb7bdc9,wl:0xb4bac8};
const UP=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3();

/* ---------- escena ---------- */
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(C.bg);S.fog=new THREE.Fog(C.bg,28,90);
const cam=new THREE.PerspectiveCamera(55,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,dark?0x30343c:0x8a8f9a,.75));
const sun=new THREE.DirectionalLight(0xffffff,.95);sun.position.set(6,14,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=sc.bottom=-16;sc.right=sc.top=16;sc.near=1;sc.far=45;sun.shadow.bias=-.0005;S.add(sun);

const cvs=f=>{const c=document.createElement('canvas');c.width=c.height=64;f(c.getContext('2d'));return c};
const side=cvs(x=>{const g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'#fff');g.addColorStop(.45,'#9fb4d0');g.addColorStop(.5,'#2a2e36');g.addColorStop(1,'#16181d');x.fillStyle=g;x.fillRect(0,0,64,64);x.fillStyle='#fff';x.fillRect(8,10,20,8)});
const topF=cvs(x=>{x.fillStyle='#fff';x.fillRect(0,0,64,64)}),botF=cvs(x=>{x.fillStyle='#16181d';x.fillRect(0,0,64,64)});
const env=new THREE.CubeTexture([side,side,topF,botF,side,side]);env.needsUpdate=true;

const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:C.fl,roughness:.95}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
const grid=new THREE.GridHelper(400,200,C.g1,C.g2);grid.position.y=.01;S.add(grid);

/* ---------- física ---------- */
const W=new CANNON.World();W.gravity.set(0,-9.82,0);W.broadphase=new CANNON.NaiveBroadphase();W.solver.iterations=12;
const M={st:new CANNON.Material('st'),b:new CANNON.Material('b'),s:new CANNON.Material('s'),g:new CANNON.Material('g')};
const cm=(a,b,f,r)=>W.addContactMaterial(new CANNON.ContactMaterial(a,b,{friction:f,restitution:r}));
cm(M.b,M.st,.3,.88);cm(M.b,M.b,.2,.9);cm(M.b,M.s,.3,.6);cm(M.b,M.g,.3,.3);
cm(M.s,M.st,.5,.12);cm(M.s,M.s,.5,.05);cm(M.s,M.g,.5,0);cm(M.g,M.st,.9,0);cm(M.g,M.g,.9,0);
const fb=new CANNON.Body({mass:0,material:M.st});fb.addShape(new CANNON.Plane());
fb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);W.addBody(fb);

/* paredes opcionales */
let walls=[];
function setWalls(on){
  if(on===!!walls.length)return;
  if(on){
    [[0,-6.5,7,.5],[-6.5,0,.5,6.5],[6.5,0,.5,6.5]].forEach(([x,z,hx,hz])=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(hx*2,6,hz*2),new THREE.MeshStandardMaterial({color:C.wl,roughness:.85}));
      m.position.set(x,3,z);m.receiveShadow=true;S.add(m);
      const b=new CANNON.Body({mass:0,material:M.st});b.addShape(new CANNON.Box(new CANNON.Vec3(hx,3,hz)));
      b.position.set(x,3,z);b.isWall=true;W.addBody(b);walls.push({m,b});
    });
  }else{
    walls.forEach(w=>{S.remove(w.m);W.remove(w.b)});walls=[];['a','o'].forEach(k=>{if(P[k]&&Math.abs(P[k].n.y)<.5)delPortal(k)});
    items.forEach(i=>{if(i.stuck&&i.stuck.wall)unstick(i)});
  }
}

/* ---------- objetos ---------- */
const items=[],pend=[],pal=[0xff4fa3,0xffb020,0x38d6ff,0xb06bff,0xff6a3d];
let sel='b',grab=null;
const stripe=col=>{const c=cvs(x=>{x.fillStyle='#'+col.toString(16).padStart(6,'0');x.fillRect(0,0,64,64);x.fillStyle='rgba(255,255,255,.9)';x.fillRect(0,26,64,12);x.fillStyle='rgba(255,255,255,.55)';x.fillRect(28,0,8,64)});return new THREE.CanvasTexture(c)};
const gooGeo=new THREE.SphereGeometry(.5,32,24);
const gooMat=new THREE.MeshPhysicalMaterial({color:0x6dff2e,roughness:.1,clearcoat:1,clearcoatRoughness:.04,emissive:0x1f6b00,emissiveIntensity:.45,envMap:env,envMapIntensity:1.2});
const dripGeo=new THREE.CylinderGeometry(.07,.05,1,10);dripGeo.translate(0,-.5,0);
const beadGeo=new THREE.SphereGeometry(.12,14,10);

function make(t,p,v){
  const b=new CANNON.Body({mass:1,linearDamping:.01,angularDamping:.1});let m;
  if(t==='b'){
    const r=rnd(.38,.55);
    m=new THREE.Mesh(new THREE.SphereGeometry(r,28,20),new THREE.MeshStandardMaterial({map:stripe(pal[Math.random()*pal.length|0]),roughness:.28,envMap:env,envMapIntensity:.7}));
    b.addShape(new CANNON.Sphere(r));b.material=M.b;
  }else if(t==='c'){
    const x=rnd(.6,1.1),y=rnd(.6,1.1),z=rnd(.6,1.1),g=new THREE.BoxGeometry(x,y,z);
    m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(rnd(.5,.68),.5,.52),roughness:.55}));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0,transparent:true,opacity:.3})));
    b.addShape(new CANNON.Box(new CANNON.Vec3(x/2,y/2,z/2)));b.material=M.s;b.mass=2;b.updateMassProperties();
  }else{
    m=new THREE.Mesh(gooGeo,gooMat);b.addShape(new CANNON.Sphere(.5));b.material=M.g;
  }
  b.position.set(p[0],p[1],p[2]);b.velocity.set(v[0],v[1],v[2]);
  b.angularVelocity.set(rnd(-3,3),rnd(-3,3),rnd(-3,3));b.quaternion.setFromEuler(rnd(0,6),rnd(0,6),rnd(0,6),'XYZ');
  const sh=b.shapes[0],it={t,body:b,mesh:m,stuck:null,drips:[],rad:t==='b'?sh.radius:t==='c'?(sh.halfExtents.x+sh.halfExtents.y+sh.halfExtents.z)/3:.5};m.userData.item=it;b.item=it;m.castShadow=true;
  if(t==='g')b.addEventListener('collide',e=>{
    if(it.stuck||e.body.mass!==0||pend.some(q=>q.it===it))return;
    const w=!!(e.body.isWall||(e.body.item&&e.body.item.stuck&&e.body.item.stuck.wall));
    if(grab&&grab.it===it&&!w)return;
    const c=e.contact,me=c.bi===b,s=me?-1:1,r=me?c.ri:c.rj;
    pend.push({it,w,n:new THREE.Vector3(c.ni.x*s,c.ni.y*s,c.ni.z*s),cp:new THREE.Vector3(b.position.x+r.x,b.position.y+r.y,b.position.z+r.z)});
  });
  S.add(m);W.addBody(b);items.push(it);
  if(items.length>45)kill(items[0]);
}
function kill(it){
  const i=items.indexOf(it);if(i<0)return;items.splice(i,1);W.remove(it.body);S.remove(it.mesh);
  if(it.mesh.geometry!==gooGeo)it.mesh.geometry.dispose();
  it.drips.forEach(d=>S.remove(d.c,d.o));if(grab&&grab.it===it)grab=null;
}
const setShape=(b,r)=>{b.shapes.length=0;b.shapeOffsets.length=0;b.shapeOrientations.length=0;b.addShape(new CANNON.Sphere(r));b.aabbNeedsUpdate=true};

/* pegajoso: se aplasta contra la superficie, tiembla y gotea */
function stick(it,cp,n,wall){
  const b=it.body,fl=n.y>.7,th=fl?.45:.55,tg=fl?1.7:1.35;
  b.type=CANNON.Body.STATIC;b.mass=0;b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);
  setShape(b,.27);const c=cp.clone().addScaledVector(n,.27);b.position.set(c.x,c.y,c.z);
  it.mesh.position.copy(cp).addScaledVector(n,th*.5);it.mesh.quaternion.setFromUnitVectors(UP,n);
  it.stuck={t:0,th,tg,wall};
  if(Math.abs(n.y)<.5){
    const tan=new THREE.Vector3().crossVectors(n,UP).normalize();
    for(let k=0;k<2;k++){
      const o=cp.clone().addScaledVector(tan,rnd(-.3,.3)).addScaledVector(n,.07);o.y=it.mesh.position.y-.2;
      const cy=new THREE.Mesh(dripGeo,gooMat),be=new THREE.Mesh(beadGeo,gooMat);
      cy.position.copy(o);be.position.copy(o);cy.scale.set(1,.01,1);cy.castShadow=be.castShadow=true;S.add(cy,be);
      it.drips.push({c:cy,o:be,y:o.y,max:rnd(.6,1.6),t:-rnd(0,.8)});
    }
  }
  if(grab&&grab.it===it)grab=null;
}
function unstick(it){
  if(!it.stuck)return;const b=it.body;
  b.type=CANNON.Body.DYNAMIC;b.mass=1;setShape(b,.5);b.updateMassProperties();
  it.stuck=null;it.drips.forEach(d=>S.remove(d.c,d.o));it.drips=[];it.mesh.scale.set(1,1,1);
}

/* ---------- crear / lanzar ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function spawn(){
  ray.setFromCamera(ndc.set(0,0),cam);const p=new THREE.Vector3();
  const hit=ray.ray.intersectPlane(new THREE.Plane(UP,0),p);
  if(!hit||p.distanceTo(cam.position)>30)p.copy(cam.position).addScaledVector(ray.ray.direction,10);
  p.x+=rnd(-.6,.6);p.z+=rnd(-.6,.6);
  if(walls.length){p.x=clamp(p.x,-5,5);p.z=clamp(p.z,-5,5)}
  make(sel,[p.x,rnd(4,6),p.z],[0,0,0]);
}
function shoot(){
  const d=new THREE.Vector3();cam.getWorldDirection(d);const p=cam.position.clone().addScaledVector(d,1.6);p.y-=.3;
  make(sel,[p.x,p.y,p.z],[d.x*20,d.y*20+4,d.z*20]);
}

/* ---------- agarrar y lanzar con el dedo ---------- */
const ndcOf=e=>ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
function startGrab(h,e){
  const it=h.object.userData.item;unstick(it);
  const dir=new THREE.Vector3();cam.getWorldDirection(dir);const b=it.body,bp=new THREE.Vector3(b.position.x,b.position.y,b.position.z);
  grab={it,pid:e.pointerId,plane:new THREE.Plane().setFromNormalAndCoplanarPoint(dir,h.point),off:h.point.clone().sub(bp),target:bp.clone()};
}
function moveGrab(e){
  ray.setFromCamera(ndcOf(e),cam);const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(grab.plane,p)){p.sub(grab.off);p.y=Math.max(p.y,.75);if(walls.length){p.x=clamp(p.x,-5.4,5.4);p.z=clamp(p.z,-5.4,5.4)}grab.target.copy(p)}
}

/* ---------- cámara y puntero ---------- */
let th=0,ph=1.15,rad=innerWidth<innerHeight?16:12;const tgt=new THREE.Vector3(0,1,0);
const placeCam=()=>{cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));if(shake>.01)cam.position.add(tmp.set(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(shake));cam.lookAt(tgt)};
const ptrs=new Map();let pinch=0,tap=null;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ray.setFromCamera(ndcOf(e),cam);const h=ray.intersectObjects(items.map(i=>i.mesh).concat(wp==='mano'?allMs():[]),false)[0];if(h)startGrab(h,e);else tap={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),m:0}}
  else if(ptrs.size===2){tap=null;if(!grab)pinch=pdist()}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(tap&&tap.id===e.pointerId)tap.m+=Math.abs(dx)+Math.abs(dy);
  if(grab){if(e.pointerId===grab.pid)moveGrab(e);return}
  if(ptrs.size===1){if(!blade()){th-=dx*.006;ph=clamp(ph-dy*.005,.2,1.5)}}
  else if(ptrs.size===2){const d=pdist();rad=clamp(rad*pinch/d,4,45);pinch=d}
});
const up=e=>{if(tap&&tap.id===e.pointerId){if(e.type==='pointerup'){if(gun&&tap.m<12&&performance.now()-tap.t<500)place(e);else if(wp!=='mano')useWp(tap,e)}tap=null}ptrs.delete(e.pointerId);if(grab&&e.pointerId===grab.pid)grab=null;if(ptrs.size===1)pinch=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();rad=clamp(rad*Math.exp(e.deltaY*.001),4,45)},{passive:false});

/* ---------- pistola de portales ---------- */
const P={},COL={a:0x2fa0ff,o:0xff8a1f},FILL={a:0x04243f,o:0x3f1b03};let gun=null;
const hi=(t,ms)=>{const h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hi.t);hi.t=setTimeout(()=>h.style.opacity=0,ms)};
const mb=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,side:THREE.DoubleSide,depthWrite:false,fog:false});
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),v3=new THREE.Vector3();
function delPortal(k){if(P[k]){S.remove(P[k].g);delete P[k]}}
function clearPortals(){delPortal('a');delPortal('o')}
function syncGun(){document.querySelectorAll('.gb').forEach(x=>x.setAttribute('aria-pressed',x.dataset.p===gun))}
function place(e){
  ray.setFromCamera(ndcOf(e),cam);
  const h=ray.intersectObjects([floor,...walls.map(w=>w.m)],false)[0];if(!h)return;
  const n=h.face.normal.clone().transformDirection(h.object.matrixWorld),fl=n.y>.7;
  if(!fl&&Math.abs(n.y)>.3)return;
  const a=fl?1.15:.85,b=fl?1.15:1.4,p=h.point.clone();
  if(!fl){p.y=clamp(p.y,b+.1,5.9-b);if(Math.abs(n.z)>.5)p.x=clamp(p.x,-6+a,6-a);else p.z=clamp(p.z,-6+a,6-a)}
  const y=fl?new THREE.Vector3(0,0,-1):UP.clone(),x=new THREE.Vector3().crossVectors(y,n).normalize(),k=gun;
  delPortal(k);
  const g=new THREE.Group(),bd=new THREE.Group(),sw=new THREE.Mesh(new THREE.RingGeometry(.5,.68,32,1,0,Math.PI*1.3),mb(COL[k],.8));
  bd.scale.set(a,b,1);
  bd.add(new THREE.Mesh(new THREE.CircleGeometry(1,40),mb(FILL[k],.9)),new THREE.Mesh(new THREE.RingGeometry(.84,1,48),mb(COL[k],1)),new THREE.Mesh(new THREE.RingGeometry(1,1.28,48),mb(COL[k],.22)),sw);
  g.add(bd);g.position.copy(p).addScaledVector(n,.03);g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,n));S.add(g);
  P[k]={g,sw,pos:p,n,x,y,a,b,t:0,pulse:0};
  const o=k==='a'?'o':'a';
  if(!P[o]){gun=o;syncGun();hi('Ahora coloca el otro portal',3500)}else hi('Lanza objetos a un portal y saldrán por el otro',4500);
}
function nearPortal(c){
  if(!P.a||!P.o)return false;
  return['a','o'].some(k=>{const q=P[k];v1.copy(c).sub(q.pos);const lx=v1.dot(q.x)/(q.a+.4),ly=v1.dot(q.y)/(q.b+.4);return lx*lx+ly*ly<1&&Math.abs(v1.dot(q.n))<.8});
}
function tele(it,dt){
  if(!P.a||!P.o||(grab&&grab.it===it))return;
  if((it.cd=(it.cd||0)-dt)>0)return;
  const b=it.body,V=b.velocity;
  for(const k of['a','o']){
    const q=P[k],z=P[k==='a'?'o':'a'];
    v1.set(b.position.x,b.position.y,b.position.z).sub(q.pos);
    const lx=v1.dot(q.x),ly=v1.dot(q.y),d=v1.dot(q.n);
